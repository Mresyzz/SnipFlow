<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="snipflow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#ff0844" />
    </linearGradient>
    <linearGradient id="snipflow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161d" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="128" height="128" rx="28" fill="url(#snipflow-bg)" stroke="#222734" stroke-width="2" />
  
  <!-- Waveform / Cut Dynamic Symbol -->
  <g filter="url(#glow)">
    <!-- Scissor / Scalpel Angle Track Left -->
    <path d="M 32 38 L 56 64 L 32 90" fill="none" stroke="url(#snipflow-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulse Waveform Peak -->
    <path d="M 54 64 L 64 36 L 74 92 L 84 52 L 96 64" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
