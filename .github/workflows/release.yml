name: Release & Distribute

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSVC 64-bit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: snipflow.exe

          # macOS Apple Silicon (M-Series)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: snipflow

          # macOS Intel 64-bit (Cross-compiled on macos-latest runner)
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: snipflow

          # Linux GNU 64-bit
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: snipflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies & Build Dist
        shell: bash
        run: |
          cd ui
          npm install
          npm run build

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip debug symbols (Unix)
        if: runner.os != 'Windows'
        run: |
          strip "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"

      - name: Prepare package directory
        shell: bash
        run: |
          PKG_DIR="snipflow-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$PKG_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          cp LICENSE "$PKG_DIR/"

      - name: Bundle portable FFmpeg for Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $PkgDir = "snipflow-${{ github.ref_name }}-${{ matrix.target }}"
          Write-Host "Downloading standalone FFmpeg & FFprobe for Windows bundle..."
          $FfmpegZip = "$env:TEMP\ffmpeg-win64.zip"
          try {
              Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $FfmpegZip
              Expand-Archive -Path $FfmpegZip -DestinationPath "$env:TEMP\ffmpeg-extracted" -Force
              $BinFolder = Get-ChildItem -Path "$env:TEMP\ffmpeg-extracted" -Recurse -Directory -Filter "bin" | Select-Object -First 1
              if ($BinFolder) {
                  Copy-Item -Path "$($BinFolder.FullName)\ffmpeg.exe" -Destination "$PkgDir\ffmpeg.exe"
                  Copy-Item -Path "$($BinFolder.FullName)\ffprobe.exe" -Destination "$PkgDir\ffprobe.exe"
                  Write-Host "[OK] Successfully bundled ffmpeg.exe and ffprobe.exe into package"
              }
          } catch {
              Write-Warning "FFmpeg pre-bundle download failed: $_"
          }

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PkgDir = "snipflow-${{ github.ref_name }}-${{ matrix.target }}"
          $ArchiveName = "$PkgDir.zip"
          Compress-Archive -Path "$PkgDir\*" -DestinationPath $ArchiveName -CompressionLevel Optimal
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -Encoding ascii "$ArchiveName.sha256"

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PKG_DIR="snipflow-${{ github.ref_name }}-${{ matrix.target }}"
          ARCHIVE_NAME="${PKG_DIR}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" "$PKG_DIR"
          if command -v sha256sum &> /dev/null; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Upload artifact package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz
            *.sha256
          retention-days: 2

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Consolidate packages and generate checksums.txt
        run: |
          mkdir -p dist
          find dist-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > checksums.txt
          echo "Generated checksums.txt:"
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
