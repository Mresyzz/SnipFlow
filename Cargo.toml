[package]
name = "snipflow"
version = "0.2.0"
edition = "2021"
authors = ["Mresyzz <dev@snipflow.org>"]
description = "Ultra-fast, local-first lossless video clipper & silence stripper powered by Rust and FFmpeg."
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Mresyzz/SnipFlow"
homepage = "https://github.com/Mresyzz/SnipFlow"
keywords = ["video", "ffmpeg", "lossless-cut", "silence-detect", "keyframes"]
categories = ["multimedia::video", "command-line-utilities"]
exclude = [
    "ui/*",
    "assets/demo.gif",
]

[lib]
name = "snipflow"
path = "src/lib.rs"

[[bin]]
name = "snipflow"
path = "src/main.rs"

[dependencies]
# Error handling
thiserror = "1.0"

# Regular expressions for parsing FFmpeg/FFprobe output
regex = "1.10"

# Logging
env_logger = { version = "0.11", default-features = false }
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime for non-blocking task offloading
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

# Tauri v2 Framework
tauri = { version = "2.0", features = [] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
